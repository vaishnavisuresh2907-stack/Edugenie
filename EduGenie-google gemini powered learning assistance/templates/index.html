<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{app_name}}</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div><small>AI LEARNING ASSISTANT</small><h1>EduGenie</h1><p>Ask questions, understand concepts, summarize content, generate quizzes and build learning paths.</p></div></header><main><section class="card"><nav><button class="active" data-task="qa">Q&A</button><button data-task="explain">Explain</button><button data-task="quiz">Quiz</button><button data-task="summarize">Summarize</button><button data-task="learn">Learning Path</button></nav><form id="form"><label id="label">Ask your question</label><textarea id="input" rows="9" placeholder="Example: What is SQL?"></textarea><div id="quizopts" class="hide">Questions <select id="count"><option>3</option><option>5</option><option>10</option></select></div><div id="levelopts" class="hide">Level <select id="level"><option>beginner</option><option>intermediate</option><option>advanced</option></select></div><button class="primary">Generate</button></form></section><section id="loading" class="card hide">EduGenie is thinking...</section><section id="error" class="card error hide"></section><section id="outcard" class="card hide"><div class="head"><h2>Result</h2><button id="copy">Copy</button></div><div id="out"></div></section></main><script src="/static/app.js"></script></body></html>
